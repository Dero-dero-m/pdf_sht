[project]
name = "scaffold-api"
version = "0.1.0"
description = "FastAPI backend for the scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "python-multipart>=0.0.20",
    "python-docx>=1.1.2",
    "pypdf>=5.1.0",
    "scaffold-shared-types",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "dirty-equals>=0.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pydantic-to-typescript>=2.0.0",
]

[tool.uv.sources]
scaffold-shared-types = { path = "../../packages/shared-types", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scaffold_shared_types.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true
follow_imports = "skip"
